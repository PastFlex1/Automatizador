<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MetaCloser CRM</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .badge {
      background: #f59e0b;
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 5px;
    }
    h3 {
      margin: 0;
      font-size: 14px;
      color: #f8fafc;
    }
    p {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      text-align: center;
      padding: 9px 0;
      border-radius: 7px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .btn:hover {
      background: linear-gradient(135deg, #059669, #047857);
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">APM INOX</span>
    <div>
      <h3>MetaCloser CRM</h3>
      <p>WhatsApp Web Extension</p>
    </div>
  </div>

  <div class="status-card">
    <span>Estado del CRM:</span>
    <span class="status-indicator">
      <span class="dot" id="crm-dot"></span>
      <span id="crm-status-text">Conectado (3000)</span>
    </span>
  </div>

  <button class="btn" id="open-wa-btn">🚀 Abrir WhatsApp Web</button>
  <a class="btn btn-secondary" href="http://localhost:3000" target="_blank">💻 Abrir MetaCloser CRM</a>

  <script src="popup.js"></script>
</body>
</html>
